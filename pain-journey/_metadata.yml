## Applies to every document in this directory and below, and to nothing
## outside it.
##
## The warm theme, the stylesheet and the citation style are project-level
## (see _quarto.yml) — every story shares one copy. What stays here is what is
## genuinely this story's own: which references it cites, and which scripts
## draw its figures.

## Unlinked for review (2026-10-22): kept out of site search until the
## writing is linked again. See the navbar note in _quarto.yml.
search: false

bibliography: refs.bib
link-citations: true

format:
  html:
    # The fonts moved to _quarto.yml when pages appeared outside the stories.
    # Quarto MERGES include-in-header across project and directory level rather
    # than replacing it, so keeping a copy here loaded the stylesheet twice —
    # verified in the rendered HTML, not assumed.
    include-after-body: _figures.html
