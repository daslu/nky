## Notknowing Garden — the site.
##
## Project root sits at the repo root deliberately. Quarto mirrors input paths
## under output-dir and offers no path rewriting, so a story's source directory
## has to carry the name its URL wants. Putting the project in a src/ folder
## with output-dir: ../docs makes Quarto warn ("strange behavior may result")
## and leaves it unable to clean docs/site_libs.
##
## docs/ is what GitHub Pages serves. It is output only — never hand-edited,
## never a source.
##
## Quarto DELETES anything in output-dir that the project does not know about.
## It removed the published story once, and replaced the shelf with a redirect
## stub. Anything that has to exist in docs/ must be a project input: either
## rendered from a .qmd here, or listed under resources below.

project:
  type: website
  output-dir: docs
  render:
    - index.qmd
    - writing/*.qmd
    - podcast/*.qmd
    - community/*.qmd
    - about/*.qmd
    - touch-journey/*.qmd
    - pain-journey/*.qmd
    - breath-journey/*.qmd
  resources:
    # Only the file the pages actually fetch at runtime. A `shared/**` glob
    # also published shared/README.md — a working document — onto the live
    # site. The stylesheets and the citation style reach docs/ through
    # Quarto's own theme handling and do not belong here.
    - shared/figure-kit.js
    # The self-hosted fonts. warm.css reaches them by url(), which Quarto's
    # resource scan does not see — same trap as the photographs below.
    - shared/fonts/**
    # The band photographs. warm.css reaches these with a url(), which
    # Quarto's resource scan does not see — unlisted, they would never
    # reach docs/, and anything already there would be deleted.
    - shared/img/**
    - touch-journey/js/**
    - pain-journey/js/**
    - breath-journey/js/**

website:
  title: "Notknowing Garden"
  # Link previews (Open Graph and Twitter cards) need absolute URLs, which
  # need site-url. The card is shared/img/share.jpg (1200x630).
  site-url: https://daslu.github.io/nky
  image: /shared/img/share.jpg
  open-graph: true
  twitter-card: true
  description: "Spaces for wellness and movement, online and in person, made by a tantra practitioner and a yoga teacher."
  page-navigation: true          # these are journeys; next/previous matters
  reader-mode: false
  # The comma from the old name, "not knowing, yet", set in Fraunces. Kept
  # until a mark for Notknowing Garden is chosen — see logos/.
  favicon: shared/img/favicon.png

  ## One navbar for the whole site. Quarto has no per-directory navbar — this
  ## appears on the journeys too, which is now correct: they are part of this
  ## site rather than a publication of their own.
  ## No story sidebar may name the front door in its contents: Quarto picks
  ## the sidebar whose contents contain the page being rendered, so listing
  ## index.html there made the front door a member of all three and it
  ## rendered wearing the touch stops. The way home is the brand below.
  navbar:
    title: "Notknowing Garden"
    # The mark alone, cropped to its own width (shared/img/mark.svg, from
    # logos/svg/logo.svg). The full lockup is on the front door.
    logo: shared/img/mark.svg
    logo-alt: "Notknowing Garden home"
    left:
      - text: "gatherings"
        href: community/index.qmd
      - text: "writing"
        href: writing/index.qmd
      - text: "the podcast"
        href: podcast/index.qmd
      - text: "about"
        href: about/index.qmd

  ## Every page used to stop dead at the end of its last paragraph. This is
  ## the close, and it is the one place the two of them are named on every
  ## page rather than only on /about/.
  page-footer:
    left: '<a href="/index.html" class="footer-brand"><img src="/shared/img/mark.svg" alt="" class="footer-mark"> Notknowing Garden</a>'
    right:
      - text: "FG"
        href: about/fg.qmd
      - text: "DS"
        href: about/ds.qmd
      # The address itself lives in _variables.yml; the footer points at the
      # one place on the site that shows it.
      - text: "write to us"
        href: about/index.qmd#write-to-us

  ## Quarto picks the sidebar whose contents contain the page being rendered,
  ## so each story gets its own stops and no story advertises another's.
  sidebar:
    - id: touch
      title: "Touch is not one sense"
      style: floating
      search: true
      collapse-level: 1
      contents:
        - text: "Start here"
          href: touch-journey/index.qmd
        - text: "One · the territory"
          href: touch-journey/territory.qmd
        - text: "Two · the second system"
          href: touch-journey/second-system.qmd
        - text: "Three · what touch does"
          href: touch-journey/what-touch-does.qmd
        - text: "Four · being honest about it"
          href: touch-journey/being-honest.qmd
        - text: "What we carry back"
          href: touch-journey/carry-back.qmd

    - id: pain
      title: "Pain is not a damage report"
      style: floating
      search: true
      collapse-level: 1
      contents:
        - text: "Start here"
          href: pain-journey/index.qmd
        - text: "One · what pain is"
          href: pain-journey/what-pain-is.qmd
        - text: "Two · how loose the link is"
          href: pain-journey/how-loose.qmd
        - text: "Three · when pain stays"
          href: pain-journey/when-it-stays.qmd
        - text: "Four · being honest about it"
          href: pain-journey/being-honest.qmd
        - text: "What we carry back"
          href: pain-journey/carry-back.qmd

    - id: breath
      title: "Breathing is not a switch"
      style: floating
      search: true
      collapse-level: 1
      contents:
        - text: "Start here"
          href: breath-journey/index.qmd
        - text: "One · what breathing is doing"
          href: breath-journey/what-it-does.qmd
        - text: "Two · why slow works"
          href: breath-journey/why-slow.qmd
        - text: "Three · being honest about it"
          href: breath-journey/being-honest.qmd
        - text: "What we carry back"
          href: breath-journey/carry-back.qmd

## The warm vocabulary lives here, at project level, so every story inherits it
## and there is one copy of the stylesheet rather than one per story. A story's
## own _metadata.yml adds only what is genuinely its own: its bibliography, and
## the script tags for its figures.
format:
  html:
    theme: [cosmo, shared/warm.scss]
    css: shared/warm.css
    csl: shared/ama.csl

    # The robots tag keeps the site out of search results while it is being
    # drafted (2026-09-07) — robots.txt cannot do it here, being read only
    # from the origin root, daslu.github.io/robots.txt, which belongs to
    # another repository. Remove the tag when the site is ready to be found.
    # The fonts used to be linked here from Google; they are self-hosted now
    # (warm.css). A leading / is the project root: Quarto rewrites it to a
    # relative path on every page, in this header text and in the footer.
    include-in-header:
      - text: |
          <meta name="robots" content="noindex">
          <link rel="icon" type="image/svg+xml" href="/shared/img/favicon.svg">
          <link rel="apple-touch-icon" href="/shared/img/apple-touch-icon.png">
    # A skip link, for keyboard users: the first Tab stop on every page.
    include-before-body:
      - text: |
          <a class="visually-hidden-focusable skip-link" href="#quarto-document-content">Skip to content</a>
    # The original page used a 1080px wrap with no persistent sidebar. Quarto's
    # default grid leaves the body column ~790px at 1400px, which shrinks every
    # wide-layout figure. This buys most of that width back.
    grid:
      sidebar-width: 240px
      body-width: 940px
      margin-width: 180px
      gutter-width: 1.5rem
    toc: true
    toc-title: "The stops on this page"
    section-divs: true           # each stop is a <section>, so the page TOC lists it
    anchor-sections: true
    link-external-newwindow: true
    citations-hover: true
