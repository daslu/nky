## Applies to every document in this directory and below, and to nothing
## outside it. Theme, stylesheet and citation style are project-level.

bibliography: refs.bib
link-citations: true

format:
  html:
    # The fonts moved to _quarto.yml when pages appeared outside the stories.
    # Quarto MERGES include-in-header across project and directory level rather
    # than replacing it, so keeping a copy here loaded the stylesheet twice —
    # verified in the rendered HTML, not assumed.
    include-after-body: _figures.html
